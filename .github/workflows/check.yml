name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    # Copies made by the Deploy button get this file too; they deploy through
    # Cloudflare and have nothing to check here.
    if: github.repository == 'rnscommerce/mftf-studio-remote-run-cloudflare'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check worker/index.js && node --check scripts/smoke.mjs && php -l runner/runner.php
      - run: npx wrangler deploy --dry-run
      - run: npm test
