name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check worker/index.js && node --check scripts/smoke.mjs && php -l runner/runner.php
      - run: npx wrangler deploy --dry-run
      - run: npm test
