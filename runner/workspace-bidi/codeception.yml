actor: Tester
paths:
  tests: tests
  log: tests/_output
  data: tests/_data
  support: framework/src/Magento/FunctionalTestingFramework
  envs: framework/etc/_envs
  output: tests/_output
settings:
  silent: true
  colors: true
  memory_limit: 1024M
extensions:
  enabled:
    - Magento\FunctionalTestingFramework\Codeception\Subscriber\Console
    - Magento\FunctionalTestingFramework\Extension\TestContextExtension
    - Qameta\Allure\Codeception\AllureCodeception
  config:
    Qameta\Allure\Codeception\AllureCodeception:
      deletePreviousResults: false
      outputDirectory: allure-results
      ignoredAnnotations:
        - env
        - zephyrId
        - useCaseId
    Magento\FunctionalTestingFramework\Extension\TestContextExtension:
      driver: \Magento\FunctionalTestingFramework\Module\MagentoWebDriver
params:
  - env/.env
